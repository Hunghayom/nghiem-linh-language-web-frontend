<div class="auth-container">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <h2>Ngoại Ngữ Nghiêm Linh</h2>
      <p>Nỗ lực - Kiên trì - Bứt phá</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button [class.active]="isLoginMode" (click)="toggleMode(true)">Đăng nhập</button>
      <button [class.active]="!isLoginMode" (click)="toggleMode(false)">Tạo tài khoản</button>
    </div>

    <!-- Login Form -->
    <form *ngIf="isLoginMode" [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()" class="auth-form fade-in">
      <div class="form-group">
        <label>Tên đăng nhập hoặc Email</label>
        <input type="text" formControlName="username" placeholder="Nhập tên đăng nhập hoặc email" />
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
      </div>
      
      <div class="form-actions">
        <a href="#" class="forgot-password">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">Đăng nhập</button>
      
      <div class="divider"><span>HOẶC</span></div>
      <button type="button" class="btn-google">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" />
        Đăng nhập bằng Google
      </button>
    </form>

    <!-- Register Form -->
    <form *ngIf="!isLoginMode" [formGroup]="registerForm" (ngSubmit)="onRegisterSubmit()" class="auth-form fade-in">
      <div class="form-group">
        <label>Họ và tên</label>
        <input type="text" formControlName="fullName" placeholder="Ví dụ: Nguyễn Minh Anh" />
      </div>

      <div class="form-group">
        <label>Bạn học khoá nào?</label>
        <div class="radio-group">
          <label class="radio-btn" [class.selected]="registerForm.get('course')?.value === 'Tiếng Trung'">
            <input type="radio" formControlName="course" value="Tiếng Trung"> Tiếng Trung
          </label>
          <label class="radio-btn" [class.selected]="registerForm.get('course')?.value === 'Tiếng Nhật'">
            <input type="radio" formControlName="course" value="Tiếng Nhật"> Tiếng Nhật
          </label>
        </div>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasStudiedBefore" />
          Bạn đã từng học tại Ngoại Ngữ Nghiêm Linh chưa?
        </label>
      </div>

      <div class="form-group slide-down" *ngIf="registerForm.get('hasStudiedBefore')?.value">
        <label>Lớp/Khóa + Tên giáo viên (Tên nhóm Zalo)</label>
        <input type="text" formControlName="previousClass" placeholder="Ví dụ: HSK1 - Cô Hạnh" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="ban@email.com" />
      </div>

      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" formControlName="username" placeholder="Ví dụ: josee" />
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
      </div>

      <div class="form-group">
        <label>Nhập lại mật khẩu</label>
        <input type="password" formControlName="confirmPassword" placeholder="••••••••" />
      </div>

      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid">Tạo tài khoản</button>
    </form>
  </div>
</div>
