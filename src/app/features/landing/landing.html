<div class="landing-container">
  <!-- Header -->
  <header class="landing-header">
    <div class="logo-area">
      <h1>Ngoại Ngữ Nghiêm Linh</h1>
    </div>
    <div class="header-actions">
      <span class="lang-selector">NGÔN NGỮ HIỂN THỊ: TIẾNG VIỆT </span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="landing-main">
    <div class="hero-image-container">
      <!-- Placeholder image for hero section, using a friendly 3D illustration style -->
      <img src="https://img.freepik.com/free-vector/learning-concept-illustration_114360-6186.jpg" alt="Học tập vui nhộn" class="hero-image" />
    </div>
    <div class="hero-content">
      <h2 class="hero-title">
        Học ngoại ngữ theo cách vui nhất, <br/>
        cùng Ngoại Ngữ Nghiêm Linh!
      </h2>
      <div class="hero-buttons">
        <!-- Route to login but we might want to pass a query param or state to open register tab -->
        <!-- For now, we will just route to /login, and the user can switch tabs. We can use fragment or queryParams if needed -->
        <a routerLink="/login" [queryParams]="{ mode: 'register' }" class="btn btn-primary">BẮT ĐẦU</a>
        <a routerLink="/login" [queryParams]="{ mode: 'login' }" class="btn btn-secondary">TÔI ĐÃ CÓ TÀI KHOẢN</a>
      </div>
    </div>
  </main>
</div>
