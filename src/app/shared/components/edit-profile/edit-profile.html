<div class="modal-overlay" *ngIf="isVisible()" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Chỉnh sửa thông tin</h2>
      <button class="btn-close" (click)="closeModal()">✕</button>
    </div>

    <div class="modal-body">
      <!-- Tên hiển thị -->
      <div class="form-group">
        <label>Tên học viên</label>
        <input type="text" [ngModel]="editName()" (ngModelChange)="editName.set($event)"
          placeholder="Nhập tên của bạn" />
      </div>

      <!-- Chọn Avatar -->
      <div class="form-group">
        <label>Chọn Ảnh Đại Diện (Avatar)</label>
        <div class="avatar-grid">
          <div class="avatar-option" *ngFor="let avatar of availableAvatars"
            [class.selected]="selectedAvatar() === avatar" (click)="selectAvatar(avatar)">
            <img [src]="avatar" alt="Avatar option">
            <div class="check-icon" *ngIf="selectedAvatar() === avatar">✓</div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeModal()">Hủy</button>
      <button class="btn-save" (click)="save()">Lưu thay đổi</button>
    </div>
  </div>
</div>
